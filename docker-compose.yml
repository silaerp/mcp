services:
  dokploy-mcp-http:
    build: .
    container_name: dokploy-mcp-http
    ports:
      - "${EXTERNAL_PORT:-3000}:3000"
    environment:
      - MCP_TRANSPORT=${MCP_TRANSPORT:-http}
      - DOKPLOY_URL=${DOKPLOY_URL:-https://your-dokploy-server.com}
      - DOKPLOY_API_KEY=${DOKPLOY_API_KEY:-your_token_here}
      # Lightweight OAuth 2.1 facade. Login uses this deployment's Dokploy API key.
      - MCP_OAUTH_ENABLED=${MCP_OAUTH_ENABLED:-false}
      - MCP_PUBLIC_URL=${MCP_PUBLIC_URL:-http://localhost:3000}
      # Comma-separated exact callback URLs; required when OAuth is enabled.
      - MCP_OAUTH_TRUSTED_REDIRECT_URIS=${MCP_OAUTH_TRUSTED_REDIRECT_URIS:-}
    restart: unless-stopped
    networks:
      - mcp-network

  dokploy-mcp-stdio:
    build: .
    container_name: dokploy-mcp-stdio
    environment:
      - DOKPLOY_URL=${DOKPLOY_URL:-https://your-dokploy-server.com}
      - DOKPLOY_API_KEY=${DOKPLOY_API_KEY:-your_token_here}
    restart: "no"
    stdin_open: true
    tty: true
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
